<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Faculty Fees - SIHMS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#16213e,#1f6f8b,#21a0a0);
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}

/* HEADER */

.header{
    background:white;
    padding:25px;
    border-radius:20px;
    margin-bottom:20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.header h1{
    color:#12344d;
    margin-bottom:6px;
}

.header p{
    color:#777;
    font-size:14px;
}

.back{
    text-decoration:none;
    background:#12344d;
    color:white;
    padding:11px 18px;
    border-radius:9px;
    font-weight:bold;
}

/* CARD */

.card{
    background:white;
    padding:25px;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.card h2{
    color:#12344d;
    margin-bottom:20px;
}

/* FORM */

.form-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field label{
    color:#475467;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

.field input,
.field select{
    padding:12px;
    border:1px solid #d8e1e5;
    border-radius:8px;
    outline:none;
    background:white;
}

.field input:focus,
.field select:focus{
    border-color:#1597b5;
}

/* BUTTON */

.add-btn{
    margin-top:18px;
    border:none;
    background:#12344d;
    color:white;
    padding:12px 22px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
}

.add-btn:hover{
    background:#0d293c;
}

/* MESSAGE */

.message{
    display:none;
    padding:12px;
    margin-top:15px;
    border-radius:8px;
}

.success{
    background:#e8f8ef;
    color:#168447;
}

.error{
    background:#fff0f0;
    color:#c0392b;
}

/* TABLE */

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1000px;
}

th{
    background:#eef7fa;
    color:#12344d;
    padding:14px;
    text-align:left;
    font-size:13px;
}

td{
    padding:13px;
    border-bottom:1px solid #eee;
    color:#475467;
    font-size:13px;
}

.paid{
    color:#168447;
    font-weight:bold;
}

.pending{
    color:#d63031;
    font-weight:bold;
}

.delete-btn{
    border:none;
    background:#fff0f0;
    color:#d63031;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
}

.empty{
    text-align:center;
    padding:30px;
    color:#888;
}

/* MOBILE */

@media(max-width:850px){

    .form-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    body{
        padding:10px;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>

<div class="container">


<!-- HEADER -->

<div class="header">

    <div>

        <h1>
            💰 Fees Management
        </h1>

        <p id="facultyName">
            Faculty
        </p>

    </div>

    <a
        href="dashboard.html"
        class="back">

        ← Dashboard

    </a>

</div>


<!-- ADD FEES -->

<div class="card">

    <h2>
        ➕ Add Student Fees
    </h2>


    <div class="form-grid">


        <!-- STUDENT -->

        <div class="field">

            <label>
                Student
            </label>

            <select id="student">

                <option value="">
                    Select Student
                </option>

            </select>

        </div>


        <!-- ACADEMIC YEAR -->

        <div class="field">

            <label>
                Academic Year
            </label>

            <input
                type="text"
                id="academicYear"
                placeholder="2026-27">

        </div>


        <!-- SEMESTER -->

        <div class="field">

            <label>
                Semester
            </label>

            <select id="semester">

                <option value="">
                    Select Semester
                </option>

                <option value="1">
                    Semester 1
                </option>

                <option value="2">
                    Semester 2
                </option>

                <option value="3">
                    Semester 3
                </option>

                <option value="4">
                    Semester 4
                </option>

                <option value="5">
                    Semester 5
                </option>

                <option value="6">
                    Semester 6
                </option>

                <option value="7">
                    Semester 7
                </option>

                <option value="8">
                    Semester 8
                </option>

            </select>

        </div>


        <!-- TOTAL FEES -->

        <div class="field">

            <label>
                Total Fees
            </label>

            <input
                type="number"
                id="totalFees"
                placeholder="Enter total fees"
                min="0">

        </div>


        <!-- PAID -->

        <div class="field">

            <label>
                Paid Amount
            </label>

            <input
                type="number"
                id="paid"
                placeholder="Enter paid amount"
                min="0">

        </div>


        <!-- STATUS -->

        <div class="field">

            <label>
                Status
            </label>

            <select id="status">

                <option value="">
                    Select Status
                </option>

                <option value="Paid">
                    Paid
                </option>

                <option value="Partial">
                    Partial
                </option>

                <option value="Pending">
                    Pending
                </option>

            </select>

        </div>


    </div>


    <button
        class="add-btn"
        onclick="addFees()">

        + Add Fees

    </button>


    <div
        id="message"
        class="message">
    </div>

</div>


<!-- RECORDS -->

<div class="card">

    <h2>
        📋 Fees Records
    </h2>


    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>
                        Student
                    </th>

                    <th>
                        Enrollment
                    </th>

                    <th>
                        Academic Year
                    </th>

                    <th>
                        Semester
                    </th>

                    <th>
                        Total Fees
                    </th>

                    <th>
                        Paid
                    </th>

                    <th>
                        Pending
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="feesTable">

            </tbody>

        </table>

    </div>

</div>


</div>


<script>


/* =====================================================
   JSON HELPER
===================================================== */

function getJSON(key){

    try{

        const data =
            localStorage.getItem(key);

        if(!data){
            return null;
        }

        return JSON.parse(data);

    }
    catch(error){

        return null;

    }

}


/* =====================================================
   GET FACULTY
===================================================== */

function getFaculty(){

    let faculty =
        getJSON(
            "loggedInFacultyData"
        );

    if(faculty){
        return faculty;
    }

    faculty =
        getJSON(
            "currentFaculty"
        );

    if(faculty){
        return faculty;
    }

    faculty =
        getJSON(
            "faculty"
        );

    return faculty || null;

}


/* =====================================================
   GET STUDENTS
===================================================== */

function getStudents(){

    const students =
        getJSON(
            "students"
        );

    return Array.isArray(students)
        ? students
        : [];

}


/* =====================================================
   STUDENT ID
===================================================== */

function getStudentId(student){

    if(!student){
        return "";
    }

    const values = [

        student.enrollment,
        student.enrollmentNo,
        student.enrollmentNumber,
        student.studentId,
        student.studentID,
        student.rollNo,
        student.rollNumber,
        student.id

    ];

    for(
        let i = 0;
        i < values.length;
        i++
    ){

        if(
            values[i] !== undefined &&
            values[i] !== null &&
            String(values[i]).trim() !== ""
        ){

            return String(
                values[i]
            ).trim();

        }

    }

    return "";

}


/* =====================================================
   STUDENT NAME
===================================================== */

function getStudentName(student){

    if(!student){
        return "Student";
    }

    return (

        student.name ||
        student.studentName ||
        student.fullName ||
        "Student"

    );

}


/* =====================================================
   LOAD STUDENTS
===================================================== */

function loadStudents(){

    const students =
        getStudents();

    const select =
        document.getElementById(
            "student"
        );

    select.innerHTML = `

        <option value="">
            Select Student
        </option>

    `;

    students.forEach(
        function(student){

            const id =
                getStudentId(
                    student
                );

            if(!id){
                return;
            }

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                id;

            option.textContent =
                getStudentName(student)
                +
                " - "
                +
                id;

            select.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   ADD FEES
===================================================== */

function addFees(){

    const studentId =
        document.getElementById(
            "student"
        ).value;

    const academicYear =
        document.getElementById(
            "academicYear"
        ).value.trim();

    const semester =
        document.getElementById(
            "semester"
        ).value;

    const totalFees =
        Number(
            document.getElementById(
                "totalFees"
            ).value
        );

    const paid =
        Number(
            document.getElementById(
                "paid"
            ).value
        );

    let status =
        document.getElementById(
            "status"
        ).value;


    /* VALIDATION */

    if(!studentId){

        showMessage(
            "Please select a student.",
            "error"
        );

        return;

    }

    if(!academicYear){

        showMessage(
            "Please enter academic year.",
            "error"
        );

        return;

    }

    if(!semester){

        showMessage(
            "Please select semester.",
            "error"
        );

        return;

    }

    if(
        isNaN(totalFees) ||
        totalFees < 0
    ){

        showMessage(
            "Please enter valid total fees.",
            "error"
        );

        return;

    }

    if(
        isNaN(paid) ||
        paid < 0
    ){

        showMessage(
            "Please enter valid paid amount.",
            "error"
        );

        return;

    }

    if(paid > totalFees){

        showMessage(
            "Paid amount cannot be greater than total fees.",
            "error"
        );

        return;

    }


    /* CALCULATE PENDING */

    const pending =
        totalFees - paid;


    /* AUTO STATUS */

    if(pending === 0){

        status = "Paid";

    }
    else if(paid > 0){

        status = "Partial";

    }
    else{

        status = "Pending";

    }


    /* FIND STUDENT */

    const students =
        getStudents();

    const student =
        students.find(
            function(item){

                return getStudentId(item)
                    ===
                    studentId;

            }
        );


    const studentName =
        getStudentName(
            student
        );


    /* OLD FEES */

    let fees =
        getJSON(
            "fees"
        );


    if(
        !Array.isArray(fees)
    ){

        fees = [];

    }


    /* RECORD */

    const record = {

        id:
            Date.now(),

        studentId:
            studentId,

        studentName:
            studentName,

        academicYear:
            academicYear,

        semester:
            semester,

        totalFees:
            totalFees,

        paid:
            paid,

        pending:
            pending,

        status:
            status,

        addedBy:
            getFacultyId()

    };


    /* SAVE */

    fees.push(
        record
    );


    localStorage.setItem(
        "fees",
        JSON.stringify(
            fees
        )
    );


    /* CLEAR */

    document.getElementById(
        "academicYear"
    ).value = "";

    document.getElementById(
        "semester"
    ).value = "";

    document.getElementById(
        "totalFees"
    ).value = "";

    document.getElementById(
        "paid"
    ).value = "";

    document.getElementById(
        "status"
    ).value = "";


    showMessage(
        "Fees added successfully.",
        "success"
    );


    loadFees();

}


/* =====================================================
   FACULTY ID
===================================================== */

function getFacultyId(){

    const faculty =
        getFaculty();

    if(!faculty){
        return "";
    }

    return (

        faculty.facultyId ||
        faculty.facultyID ||
        faculty.employeeId ||
        faculty.employeeID ||
        faculty.id ||
        ""

    );

}


/* =====================================================
   LOAD FEES
===================================================== */

function loadFees(){

    const fees =
        getJSON(
            "fees"
        );

    const records =
        Array.isArray(fees)
        ? fees
        : [];

    const table =
        document.getElementById(
            "feesTable"
        );

    table.innerHTML = "";


    if(records.length === 0){

        table.innerHTML = `

            <tr>

                <td
                    colspan="9"
                    class="empty">

                    No fees records found.

                </td>

            </tr>

        `;

        return;

    }


    const sorted =
        [...records].reverse();


    sorted.forEach(
        function(record){

            const row =
                document.createElement(
                    "tr"
                );


            const statusClass =
                record.status === "Paid"
                ? "paid"
                : "pending";


            row.innerHTML = `

                <td>
                    ${record.studentName || "-"}
                </td>

                <td>
                    ${record.studentId || "-"}
                </td>

                <td>
                    ${record.academicYear || "-"}
                </td>

                <td>
                    ${record.semester || "-"}
                </td>

                <td>
                    ₹${record.totalFees || 0}
                </td>

                <td>
                    ₹${record.paid || 0}
                </td>

                <td>
                    ₹${record.pending || 0}
                </td>

                <td class="${statusClass}">
                    ${record.status || "-"}
                </td>

                <td>

                    <button
                        class="delete-btn"
                        onclick="deleteFees(${record.id})">

                        Delete

                    </button>

                </td>

            `;


            table.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   DELETE FEES
===================================================== */

function deleteFees(id){

    if(
        !confirm(
            "Are you sure you want to delete this fee record?"
        )
    ){

        return;

    }


    let fees =
        getJSON(
            "fees"
        );


    if(
        !Array.isArray(fees)
    ){

        fees = [];

    }


    fees =
        fees.filter(
            function(record){

                return Number(
                    record.id
                )
                !==
                Number(id);

            }
        );


    localStorage.setItem(
        "fees",
        JSON.stringify(
            fees
        )
    );


    loadFees();


    showMessage(
        "Fee record deleted successfully.",
        "success"
    );

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "message"
        );


    message.style.display =
        "block";


    message.className =
        "message " +
        type;


    message.textContent =
        text;


    setTimeout(
        function(){

            message.style.display =
                "none";

        },
        3000
    );

}


/* =====================================================
   FACULTY NAME
===================================================== */

function loadFacultyName(){

    const faculty =
        getFaculty();


    if(!faculty){
        return;
    }


    document.getElementById(
        "facultyName"
    ).textContent =

        faculty.name ||
        faculty.facultyName ||
        faculty.fullName ||
        "Faculty";

}


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadFacultyName();

        loadStudents();

        loadFees();

    }
);

</script>

</body>

</html>
