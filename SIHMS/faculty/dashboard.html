<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Faculty Dashboard - SIHMS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#102a43,#12647d,#20a0c5);
    padding:20px;
}

.container{
    max-width:1100px;
    margin:auto;
}

.header{
    background:white;
    padding:25px;
    border-radius:20px;
    margin-bottom:20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.header h1{
    color:#12344d;
    margin-bottom:7px;
}

.header p{
    color:#777;
    font-size:14px;
}

.logout{
    border:none;
    background:#d63031;
    color:white;
    padding:11px 18px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
}

.card{
    background:white;
    padding:25px;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.card h2{
    color:#12344d;
    margin-bottom:20px;
}

.info-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.info{
    background:#f5fafc;
    padding:18px;
    border-radius:12px;
}

.info label{
    display:block;
    color:#777;
    font-size:12px;
    margin-bottom:7px;
}

.info strong{
    color:#12344d;
    font-size:15px;
    word-break:break-word;
}

.service-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.service{
    border:none;
    background:#eef7fa;
    padding:25px 15px;
    border-radius:15px;
    cursor:pointer;
    color:#12344d;
}

.service:hover{
    background:#dceff4;
}

.icon{
    font-size:35px;
    margin-bottom:10px;
}

.service h3{
    margin-bottom:7px;
}

.service p{
    color:#777;
    font-size:13px;
}

@media(max-width:800px){

    .info-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .service-grid{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    body{
        padding:10px;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .info-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- HEADER -->

<div class="header">

    <div>

        <h1>
            👨‍🏫 Faculty Dashboard
        </h1>

        <p id="welcome">
            Welcome Faculty
        </p>

    </div>


    <button
        class="logout"
        onclick="logout()">

        Logout

    </button>

</div>


<!-- FACULTY INFORMATION -->

<div class="card">

    <h2>
        👤 Faculty Information
    </h2>


    <div class="info-grid">


        <div class="info">

            <label>
                Faculty Name
            </label>

            <strong id="name">
                -
            </strong>

        </div>


        <div class="info">

            <label>
                Faculty ID
            </label>

            <strong id="facultyId">
                -
            </strong>

        </div>


        <div class="info">

            <label>
                Email
            </label>

            <strong id="email">
                -
            </strong>

        </div>


        <div class="info">

            <label>
                Phone
            </label>

            <strong id="phone">
                -
            </strong>

        </div>


        <div class="info">

            <label>
                Department
            </label>

            <strong id="department">
                -
            </strong>

        </div>


        <div class="info">

            <label>
                Designation
            </label>

            <strong id="designation">
                -
            </strong>

        </div>


    </div>

</div>


<!-- SERVICES -->

<div class="card">

    <h2>
        📚 Faculty Services
    </h2>


    <div class="service-grid">


        <button
            class="service"
            onclick="goAttendance()">

            <div class="icon">
                📋
            </div>

            <h3>
                Attendance
            </h3>

            <p>
                Manage student attendance
            </p>

        </button>


        <button
            class="service"
            onclick="goResults()">

            <div class="icon">
                📊
            </div>

            <h3>
                Results
            </h3>

            <p>
                Manage student results
            </p>

        </button>


        <button
            class="service"
            onclick="goFees()">

            <div class="icon">
                💰
            </div>

            <h3>
                Fees
            </h3>

            <p>
                Manage student fees
            </p>

        </button>


    </div>

</div>


</div>


<script>


/* =========================================
   LOAD LOGGED FACULTY
========================================= */

function loadFaculty(){

    /*
       Get logged faculty
    */

    const data =
        localStorage.getItem(
            "loggedInFacultyData"
        );


    if(!data){

        alert(
            "Faculty login required."
        );


        window.location.href =
            "login.html";


        return;

    }


    let faculty;


    try{

        faculty =
            JSON.parse(data);

    }
    catch(error){

        alert(
            "Faculty login data is invalid."
        );


        window.location.href =
            "login.html";


        return;

    }


    if(!faculty){

        window.location.href =
            "login.html";

        return;

    }


    /* =====================================
       DISPLAY DATA
    ===================================== */

    document.getElementById(
        "name"
    ).textContent =
        faculty.name || "-";


    document.getElementById(
        "facultyId"
    ).textContent =
        faculty.facultyId || "-";


    document.getElementById(
        "email"
    ).textContent =
        faculty.email || "-";


    document.getElementById(
        "phone"
    ).textContent =
        faculty.phone || "-";


    document.getElementById(
        "department"
    ).textContent =
        faculty.department || "-";


    document.getElementById(
        "designation"
    ).textContent =
        faculty.designation || "-";


    document.getElementById(
        "welcome"
    ).textContent =
        "Welcome, " +
        (faculty.name || "Faculty");

}


/* =========================================
   ATTENDANCE
========================================= */

function goAttendance(){

    window.location.href =
        "attendance.html";

}


/* =========================================
   RESULTS
========================================= */

function goResults(){

    window.location.href =
        "results.html";

}


/* =========================================
   FEES
========================================= */

function goFees(){

    window.location.href =
        "fees.html";

}


/* =========================================
   LOGOUT
========================================= */

function logout(){

    localStorage.removeItem(
        "loggedInFacultyData"
    );

    localStorage.removeItem(
        "loggedInFaculty"
    );

    localStorage.removeItem(
        "currentFaculty"
    );

    localStorage.removeItem(
        "facultyId"
    );


    window.location.href =
        "login.html";

}


/* =========================================
   START
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadFaculty();

    }
);

</script>


</body>

</html>
