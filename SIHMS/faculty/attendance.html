<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Faculty Attendance - SIHMS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#16213e,#1f6f8b,#21a0a0);
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
}


/* HEADER */

.header{
    background:white;
    padding:25px;
    border-radius:20px;
    margin-bottom:20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.header h1{
    color:#12344d;
    margin-bottom:6px;
}

.header p{
    color:#777;
    font-size:14px;
}

.back{
    text-decoration:none;
    background:#12344d;
    color:white;
    padding:11px 18px;
    border-radius:9px;
    font-weight:bold;
}


/* CARD */

.card{
    background:white;
    padding:25px;
    border-radius:20px;
    margin-bottom:20px;

    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.card h2{
    color:#12344d;
    margin-bottom:20px;
}


/* FORM */

.form-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field label{
    color:#475467;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

.field input,
.field select{
    padding:12px;
    border:1px solid #d8e1e5;
    border-radius:8px;
    outline:none;
    background:white;
}

.field input:focus,
.field select:focus{
    border-color:#1597b5;
}


/* BUTTON */

.add-btn{
    margin-top:18px;
    border:none;
    background:#12344d;
    color:white;
    padding:12px 22px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
}

.add-btn:hover{
    background:#0d293c;
}


/* MESSAGE */

.message{
    display:none;
    padding:12px;
    margin-top:15px;
    border-radius:8px;
}

.success{
    background:#e8f8ef;
    color:#168447;
}

.error{
    background:#fff0f0;
    color:#c0392b;
}


/* TABLE */

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:800px;
}

th{
    background:#eef7fa;
    color:#12344d;
    padding:14px;
    text-align:left;
    font-size:13px;
}

td{
    padding:13px;
    border-bottom:1px solid #eee;
    color:#475467;
    font-size:13px;
}


/* STATUS */

.present{
    color:#168447;
    font-weight:bold;
}

.absent{
    color:#d63031;
    font-weight:bold;
}


/* DELETE */

.delete-btn{
    border:none;
    background:#fff0f0;
    color:#d63031;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
}


/* EMPTY */

.empty{
    text-align:center;
    padding:30px;
    color:#888;
}


/* MOBILE */

@media(max-width:850px){

    .form-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    body{
        padding:10px;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div>

        <h1>
            📋 Attendance Management
        </h1>

        <p id="facultyName">
            Faculty
        </p>

    </div>


    <a
        href="dashboard.html"
        class="back">

        ← Dashboard

    </a>

</div>


<!-- =====================================================
     ADD ATTENDANCE
===================================================== -->

<div class="card">

    <h2>
        ➕ Add Attendance
    </h2>


    <div class="form-grid">


        <!-- STUDENT -->

        <div class="field">

            <label>
                Student
            </label>

            <select id="student">

                <option value="">
                    Select Student
                </option>

            </select>

        </div>


        <!-- SUBJECT -->

        <div class="field">

            <label>
                Subject
            </label>

            <input
                type="text"
                id="subjectName"
                placeholder="Enter subject">

        </div>


        <!-- DATE -->

        <div class="field">

            <label>
                Date
            </label>

            <input
                type="date"
                id="date">

        </div>


        <!-- STATUS -->

        <div class="field">

            <label>
                Attendance Status
            </label>

            <select id="status">

                <option value="">
                    Select Status
                </option>

                <option value="Present">
                    Present
                </option>

                <option value="Absent">
                    Absent
                </option>

            </select>

        </div>


    </div>


    <button
        class="add-btn"
        onclick="addAttendance()">

        + Add Attendance

    </button>


    <div
        id="message"
        class="message">
    </div>

</div>


<!-- =====================================================
     RECORDS
===================================================== -->

<div class="card">

    <h2>
        📋 Attendance Records
    </h2>


    <div class="table-wrapper">

        <table>

            <thead>

                <tr>

                    <th>
                        Student
                    </th>

                    <th>
                        Enrollment
                    </th>

                    <th>
                        Subject
                    </th>

                    <th>
                        Date
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="attendanceTable">

            </tbody>

        </table>

    </div>

</div>


</div>


<script>


/* =====================================================
   JSON HELPER
===================================================== */

function getJSON(key){

    try{

        const data =
            localStorage.getItem(key);

        if(!data){
            return null;
        }

        return JSON.parse(data);

    }
    catch(error){

        return null;

    }

}


/* =====================================================
   GET FACULTY
===================================================== */

function getFaculty(){

    let faculty =
        getJSON(
            "loggedInFacultyData"
        );


    if(faculty){
        return faculty;
    }


    faculty =
        getJSON(
            "currentFaculty"
        );


    if(faculty){
        return faculty;
    }


    faculty =
        getJSON(
            "faculty"
        );


    return faculty || null;

}


/* =====================================================
   GET STUDENTS
===================================================== */

function getStudents(){

    const students =
        getJSON(
            "students"
        );


    return Array.isArray(students)
        ? students
        : [];

}


/* =====================================================
   STUDENT ID
===================================================== */

function getStudentId(student){

    if(!student){
        return "";
    }


    const values = [

        student.enrollment,

        student.enrollmentNo,

        student.enrollmentNumber,

        student.studentId,

        student.studentID,

        student.rollNo,

        student.rollNumber,

        student.id

    ];


    for(
        let i = 0;
        i < values.length;
        i++
    ){

        if(
            values[i] !== undefined &&
            values[i] !== null &&
            String(values[i]).trim() !== ""
        ){

            return String(
                values[i]
            ).trim();

        }

    }


    return "";

}


/* =====================================================
   STUDENT NAME
===================================================== */

function getStudentName(student){

    if(!student){
        return "Student";
    }


    return (

        student.name ||

        student.studentName ||

        student.fullName ||

        "Student"

    );

}


/* =====================================================
   LOAD STUDENTS
===================================================== */

function loadStudents(){

    const students =
        getStudents();


    const select =
        document.getElementById(
            "student"
        );


    select.innerHTML = `

        <option value="">
            Select Student
        </option>

    `;


    students.forEach(
        function(student){

            const id =
                getStudentId(
                    student
                );


            if(!id){
                return;
            }


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                id;


            option.textContent =
                getStudentName(
                    student
                )
                +
                " - "
                +
                id;


            select.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   ADD ATTENDANCE
===================================================== */

function addAttendance(){

    const studentId =
        document.getElementById(
            "student"
        ).value;


    const subjectName =
        document.getElementById(
            "subjectName"
        ).value.trim();


    const date =
        document.getElementById(
            "date"
        ).value;


    const status =
        document.getElementById(
            "status"
        ).value;


    /* VALIDATION */

    if(!studentId){

        showMessage(
            "Please select a student.",
            "error"
        );

        return;

    }


    if(!subjectName){

        showMessage(
            "Please enter subject name.",
            "error"
        );

        return;

    }


    if(!date){

        showMessage(
            "Please select date.",
            "error"
        );

        return;

    }


    if(!status){

        showMessage(
            "Please select attendance status.",
            "error"
        );

        return;

    }


    /* FIND STUDENT */

    const students =
        getStudents();


    const student =
        students.find(
            function(item){

                return getStudentId(
                    item
                )
                ===
                studentId;

            }
        );


    const name =
        getStudentName(
            student
        );


    /* GET OLD RECORDS */

    let attendance =
        getJSON(
            "attendance"
        );


    if(
        !Array.isArray(attendance)
    ){

        attendance = [];

    }


    /* CREATE RECORD */

    const record = {

        id:
            Date.now(),

        studentId:
            studentId,

        studentName:
            name,

        subjectName:
            subjectName,

        date:
            date,

        status:
            status,

        addedBy:
            getFacultyId()

    };


    /* SAVE */

    attendance.push(
        record
    );


    localStorage.setItem(
        "attendance",
        JSON.stringify(
            attendance
        )
    );


    /* CLEAR FORM */

    document.getElementById(
        "subjectName"
    ).value = "";


    document.getElementById(
        "date"
    ).value = "";


    document.getElementById(
        "status"
    ).value = "";


    showMessage(
        "Attendance added successfully.",
        "success"
    );


    loadAttendance();

}


/* =====================================================
   FACULTY ID
===================================================== */

function getFacultyId(){

    const faculty =
        getFaculty();


    if(!faculty){
        return "";
    }


    return (

        faculty.facultyId ||

        faculty.facultyID ||

        faculty.employeeId ||

        faculty.employeeID ||

        faculty.id ||

        ""

    );

}


/* =====================================================
   LOAD ATTENDANCE
===================================================== */

function loadAttendance(){

    const attendance =
        getJSON(
            "attendance"
        );


    const records =
        Array.isArray(attendance)
        ? attendance
        : [];


    const table =
        document.getElementById(
            "attendanceTable"
        );


    table.innerHTML = "";


    if(records.length === 0){

        table.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="empty">

                    No attendance records found.

                </td>

            </tr>

        `;

        return;

    }


    const sorted =
        [...records].reverse();


    sorted.forEach(
        function(record){

            const row =
                document.createElement(
                    "tr"
                );


            const statusClass =
                record.status === "Present"
                ? "present"
                : "absent";


            row.innerHTML = `

                <td>
                    ${record.studentName || "-"}
                </td>

                <td>
                    ${record.studentId || "-"}
                </td>

                <td>
                    ${record.subjectName || "-"}
                </td>

                <td>
                    ${record.date || "-"}
                </td>

                <td class="${statusClass}">

                    ${
                        record.status === "Present"
                        ? "✓ Present"
                        : "✕ Absent"
                    }

                </td>

                <td>

                    <button
                        class="delete-btn"
                        onclick="deleteAttendance(${record.id})">

                        Delete

                    </button>

                </td>

            `;


            table.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   DELETE ATTENDANCE
===================================================== */

function deleteAttendance(id){

    if(
        !confirm(
            "Are you sure you want to delete this attendance record?"
        )
    ){

        return;

    }


    let attendance =
        getJSON(
            "attendance"
        );


    if(
        !Array.isArray(attendance)
    ){

        attendance = [];

    }


    attendance =
        attendance.filter(
            function(record){

                return Number(
                    record.id
                )
                !==
                Number(id);

            }
        );


    localStorage.setItem(
        "attendance",
        JSON.stringify(
            attendance
        )
    );


    loadAttendance();


    showMessage(
        "Attendance deleted successfully.",
        "success"
    );

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "message"
        );


    message.style.display =
        "block";


    message.className =
        "message " +
        type;


    message.textContent =
        text;


    setTimeout(
        function(){

            message.style.display =
                "none";

        },
        3000
    );

}


/* =====================================================
   FACULTY NAME
===================================================== */

function loadFacultyName(){

    const faculty =
        getFaculty();


    if(!faculty){
        return;
    }


    document.getElementById(
        "facultyName"
    ).textContent =

        faculty.name ||

        faculty.facultyName ||

        faculty.fullName ||

        "Faculty";

}


/* =====================================================
   TODAY'S DATE
===================================================== */

function setToday(){

    const date =
        new Date();


    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "date"
    ).value =

        year +
        "-" +
        month +
        "-" +
        day;

}


/* =====================================================
   START
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadFacultyName();

        loadStudents();

        loadAttendance();

        setToday();

    }
);

</script>

</body>

</html>
