<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Change Password - SIHMS</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0b263d,#12647d,#20a6c5);
    padding:20px;
}

.container{
    max-width:650px;
    margin:auto;
}

.header{
    background:white;
    padding:25px;
    border-radius:20px;
    margin-bottom:20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.header h1{
    color:#12344d;
    margin-bottom:6px;
}

.header p{
    color:#777;
    font-size:14px;
}

.back{
    text-decoration:none;
    background:#12344d;
    color:white;
    padding:11px 18px;
    border-radius:9px;
    font-weight:bold;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;

    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.card h2{
    color:#12344d;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    color:#475467;
    font-size:13px;
    font-weight:bold;
    margin-bottom:8px;
}

.form-group input{
    width:100%;
    padding:13px 14px;

    border:1px solid #d5dde2;
    border-radius:9px;

    outline:none;
    font-size:14px;
}

.form-group input:focus{
    border-color:#20a6c5;
}

.password-box{
    position:relative;
}

.password-box input{
    padding-right:45px;
}

.toggle{
    position:absolute;
    right:12px;
    top:12px;

    border:0;
    background:none;

    cursor:pointer;
    font-size:16px;
}

.update-btn{
    width:100%;
    border:0;

    background:#12344d;
    color:white;

    padding:14px;
    border-radius:10px;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;
    margin-top:8px;
}

.update-btn:hover{
    background:#0b263d;
}

.message{
    display:none;
    padding:12px;
    border-radius:8px;
    margin-bottom:18px;
    font-size:13px;
    font-weight:bold;
}

.success{
    background:#e7f7ed;
    color:#168447;
}

.error{
    background:#fdeaea;
    color:#d63031;
}

.requirements{
    background:#f5fafc;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
}

.requirements p{
    color:#12344d;
    font-size:13px;
    font-weight:bold;
    margin-bottom:8px;
}

.requirements ul{
    padding-left:20px;
}

.requirements li{
    color:#777;
    font-size:12px;
    margin-bottom:4px;
}

@media(max-width:700px){

    body{
        padding:10px;
    }

    .header{
        padding:18px;
    }

    .header h1{
        font-size:22px;
    }

    .card{
        padding:20px;
    }

}

</style>

</head>


<body>


<div class="container">


<!-- HEADER -->

<div class="header">

    <div>

        <h1>
            Change Password
        </h1>

        <p id="studentName">
            Student Account Security
        </p>

    </div>


    <a
        href="dashboard.html"
        class="back">

        ← Dashboard

    </a>

</div>



<!-- FORM -->

<div class="card">

    <h2>
        🔐 Update Password
    </h2>


    <div
        id="message"
        class="message">
    </div>


    <div class="requirements">

        <p>
            Password Requirements
        </p>

        <ul>

            <li>
                Minimum 6 characters
            </li>

            <li>
                New password and confirmation must match
            </li>

        </ul>

    </div>



    <!-- CURRENT PASSWORD -->

    <div class="form-group">

        <label>
            Current Password
        </label>

        <div class="password-box">

            <input
                type="password"
                id="currentPassword"
                placeholder="Enter current password">

            <button
                type="button"
                class="toggle"
                onclick="togglePassword('currentPassword',this)">

                👁

            </button>

        </div>

    </div>



    <!-- NEW PASSWORD -->

    <div class="form-group">

        <label>
            New Password
        </label>

        <div class="password-box">

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password">

            <button
                type="button"
                class="toggle"
                onclick="togglePassword('newPassword',this)">

                👁

            </button>

        </div>

    </div>



    <!-- CONFIRM PASSWORD -->

    <div class="form-group">

        <label>
            Confirm New Password
        </label>

        <div class="password-box">

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password">

            <button
                type="button"
                class="toggle"
                onclick="togglePassword('confirmPassword',this)">

                👁

            </button>

        </div>

    </div>



    <button
        class="update-btn"
        onclick="changePassword()">

        Update Password

    </button>


</div>

</div>



<script>


/* =====================================
   GET STUDENT
===================================== */

let student = null;


/* METHOD 1 */

const savedStudent =
    localStorage.getItem(
        "loggedInStudentData"
    );


if(savedStudent){

    try{

        student =
            JSON.parse(
                savedStudent
            );

    }
    catch(error){

        student = null;

    }

}



/* METHOD 2 */

if(!student){

    const enrollment =
        localStorage.getItem(
            "loggedInStudent"
        );


    const students =
        JSON.parse(
            localStorage.getItem(
                "students"
            )
        ) || [];


    if(enrollment){

        student =
            students.find(
                function(item){

                    return String(
                        item.enrollment
                    ).trim()
                    ===
                    String(
                        enrollment
                    ).trim();

                }
            );

    }

}



/* METHOD 3 */

if(!student){

    const oldStudent =
        localStorage.getItem(
            "student"
        );


    if(oldStudent){

        try{

            student =
                JSON.parse(
                    oldStudent
                );

        }
        catch(error){

            student = null;

        }

    }

}



/* =====================================
   SHOW STUDENT
===================================== */

if(student){

    const name =
        student.name ||
        student.studentName ||
        "Student";


    const enrollment =
        student.enrollment ||
        student.enrollmentNo ||
        student.id ||
        "";


    document.getElementById(
        "studentName"
    ).textContent =
        name +
        " (" +
        enrollment +
        ")";

}



/* =====================================
   PASSWORD VISIBILITY
===================================== */

function togglePassword(
    id,
    button
){

    const input =
        document.getElementById(
            id
        );


    if(input.type === "password"){

        input.type = "text";

        button.textContent = "🙈";

    }
    else{

        input.type = "password";

        button.textContent = "👁";

    }

}



/* =====================================
   MESSAGE
===================================== */

function showMessage(
    text,
    type
){

    const message =
        document.getElementById(
            "message"
        );


    message.textContent =
        text;


    message.className =
        "message " +
        type;


    message.style.display =
        "block";

}



/* =====================================
   CHANGE PASSWORD
===================================== */

function changePassword(){

    if(!student){

        showMessage(
            "Student information not found.",
            "error"
        );

        return;

    }


    const currentPassword =
        document.getElementById(
            "currentPassword"
        ).value;


    const newPassword =
        document.getElementById(
            "newPassword"
        ).value;


    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        ).value;



    /* EMPTY CHECK */

    if(
        !currentPassword ||
        !newPassword ||
        !confirmPassword
    ){

        showMessage(
            "Please fill all password fields.",
            "error"
        );

        return;

    }



    /* CURRENT PASSWORD */

    const storedPassword =
        student.password ||
        student.passcode ||
        "";


    if(
        storedPassword &&
        String(storedPassword)
        !==
        String(currentPassword)
    ){

        showMessage(
            "Current password is incorrect.",
            "error"
        );

        return;

    }



    /* LENGTH */

    if(newPassword.length < 6){

        showMessage(
            "New password must contain at least 6 characters.",
            "error"
        );

        return;

    }



    /* MATCH */

    if(
        newPassword !==
        confirmPassword
    ){

        showMessage(
            "New password and confirmation do not match.",
            "error"
        );

        return;

    }



    /* SAME PASSWORD */

    if(
        newPassword ===
        currentPassword
    ){

        showMessage(
            "New password must be different from current password.",
            "error"
        );

        return;

    }



    /* =================================
       UPDATE STUDENT RECORD
    ================================= */

    const enrollment =
        student.enrollment ||
        student.enrollmentNo ||
        student.id ||
        "";


    const students =
        JSON.parse(
            localStorage.getItem(
                "students"
            )
        ) || [];


    let updated = false;


    const updatedStudents =
        students.map(
            function(item){

                const itemEnrollment =
                    item.enrollment ||
                    item.enrollmentNo ||
                    item.id ||
                    "";


                if(
                    String(
                        itemEnrollment
                    ).trim()
                    ===
                    String(
                        enrollment
                    ).trim()
                ){

                    updated = true;


                    return {
                        ...item,
                        password:
                            newPassword
                    };

                }


                return item;

            }
        );



    /* SAVE STUDENT DATABASE */

    if(updated){

        localStorage.setItem(
            "students",
            JSON.stringify(
                updatedStudents
            )
        );

    }



    /* =================================
       UPDATE LOGGED-IN STUDENT DATA
    ================================= */

    student.password =
        newPassword;


    localStorage.setItem(
        "loggedInStudentData",
        JSON.stringify(
            student
        )
    );



    /* =================================
       SUCCESS
    ================================= */

    showMessage(
        "Password updated successfully.",
        "success"
    );


    document.getElementById(
        "currentPassword"
    ).value = "";


    document.getElementById(
        "newPassword"
    ).value = "";


    document.getElementById(
        "confirmPassword"
    ).value = "";

}

</script>


</body>

</html>
